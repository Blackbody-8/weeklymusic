name: Weekly Music Drop

on:
  schedule:
    # Runs every Friday at 13:00 UTC (6am Pacific during daylight saving;
    # shift to 14:00 UTC once Oregon falls back to standard time in
    # November, if you want the same local time year-round).
    - cron: "0 13 * * 5"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab, any day, for testing

permissions:
  contents: write  # lets the script commit updated pages back to this repo

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the weekly update
        run: python3 weekly_update.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_BRANCH: main
